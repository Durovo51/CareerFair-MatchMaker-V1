{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Your Booth Game Plan</h2>

{% if no_match_message %}
<p class="text-gray-600">{{ no_match_message }}</p>
{% else %}
<div class="space-y-3">
    {% for booth in booth_recomendations %}
    <div class="bg-white shadow rounded-lg p-4 border border-gray-200">
        <h3 class="font-bold text-lg">{{ booth.company }}</h3>
        <p class="text-gray-600">{{ booth.talking_points }}</p>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endblock %}
